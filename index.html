<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardianes Verdes - Catálogo de Exploración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; }
        .modern-card {
            max-width: 480px;
            margin: 40px auto;
            border-radius: 30px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .modern-card:hover { transform: scale(1.02); }
        .gradient-green {
            background: linear-gradient(135deg, #065f46 0%, #059669 100%);
        }
        .img-container {
            height: 300px;
            overflow: hidden;
            position: relative;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body class="p-6">

    <div class="modern-card">
        <div class="img-container">
            <img src="rosario.jpg" alt="Planta Rosario">
            <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black/70 to-transparent">
                <h1 class="text-3xl font-bold text-white font-['Fredoka']">Planta Rosario</h1>
            </div>
        </div>

        <div class="p-8 text-center space-y-4">
            <div class="flex justify-between text-[10px] uppercase tracking-[3px] text-gray-400 font-bold border-b pb-4">
                <span>I.E. Dinamarca</span>
                <span>PROYECTO 2026</span>
            </div>

            <div class="py-4">
                <p class="text-rose-500 font-bold text-[10px] uppercase tracking-widest mb-1">Nombre Científico:</p>
                <p class="text-xl font-semibold text-emerald-800 italic font-serif">Senecio rowleyanus</p>
            </div>

            <a href="detalle-rosario.html" class="gradient-green text-white w-full py-4 rounded-2xl flex items-center justify-center gap-3 hover:shadow-xl transition-all font-bold text-lg">
                <span class="text-2xl">🌿</span> Ver Información Mágica
            </a>
        </div>
    </div>

    <div class="modern-card">
        <div class="img-container">
            <img src="otnna.jpg" alt="Collar de Rubíes">
            <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black/70 to-transparent">
                <h1 class="text-3xl font-bold text-white font-['Fredoka']">Collar de Rubíes</h1>
            </div>
        </div>

        <div class="p-8 text-center space-y-4">
            <div class="flex justify-between text-[10px] uppercase tracking-[3px] text-gray-400 font-bold border-b pb-4">
                <span>I.E. Dinamarca</span>
                <span>PROYECTO 2026</span>
            </div>

            <div class="py-4">
                <p class="text-rose-500 font-bold text-[10px] uppercase tracking-widest mb-1">Nombre Científico:</p>
                <p class="text-xl font-semibold text-emerald-800 italic font-serif">Othonna capensis</p>
            </div>

            <a href="detalle-othonna.html" class="gradient-green text-white w-full py-4 rounded-2xl flex items-center justify-center gap-3 hover:shadow-xl transition-all font-bold text-lg">
                <span class="text-2xl">💎</span> Ver Información Mágica
            </a>
        </div>
    </div>

</body>
</html>
